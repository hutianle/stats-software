# Deploy the Shiny app to shinyapps.io on push to main.
#
# Required repository secrets (set by the account owner in the GitHub
# repository Settings -> Secrets and variables -> Actions; never put
# tokens or secrets in this file):
#   SHINYAPPS_TOKEN  - shinyapps.io account token
#   SHINYAPPS_SECRET - shinyapps.io account secret
# Optional repository variable:
#   SHINYAPPS_ACCOUNT - shinyapps.io account name (defaults to hutianle)
name: Deploy to shinyapps.io

on:
  push:
    branches: [main]
    paths:
      - 'app.R'
      - '.github/workflows/shinyapps-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::cpp11
            any::gsDesign
            any::ggplot2
            any::DT
            any::jsonlite
            any::rmarkdown
            any::rsconnect

      # Fix for the shinyapps.io image build: packages installed from Posit
      # Package Manager record `Repository: RSPM` in their DESCRIPTION, and
      # the shinyapps.io builder cannot resolve a bare repository name
      # ("Unsupported url scheme: RSPM/src/contrib/..." on run #4, and
      # "CRAN/src/contrib/..." on run #5 after relabelling to the bare
      # word CRAN). The manifest must carry a full URL, so relabel them
      # to https://packagemanager.posit.co/cran/__linux__/jammy/latest. Verified locally with
      # rsconnect::writeManifest: a full-URL Repository passes through
      # into the manifest untouched, while a bare name does not.
      # Run #6 failed here with "Permission denied" on
      # /opt/R/4.3.3/lib/R/library/boot/DESCRIPTION: the loop must skip
      # the read-only system library and only touch writable libraries
      # (where setup-r-dependencies actually installed the packages).
      - name: Relabel RSPM packages with full CRAN URL
        run: |
          Rscript -e 'n <- 0L; for (lib in .libPaths()) { if (file.access(lib, 2L) != 0L) next; for (d in list.files(lib, pattern = "^DESCRIPTION$", recursive = TRUE, full.names = TRUE)) { x <- readLines(d, warn = FALSE); hit <- grepl("^Repository: (RSPM|CRAN)$", x); if (any(hit)) { x[hit] <- "Repository: https://packagemanager.posit.co/cran/__linux__/jammy/latest"; writeLines(x, d); n <- n + 1L } } }; cat("Relabelled", n, "package DESCRIPTION(s) to https://packagemanager.posit.co/cran/__linux__/jammy/latest\n")'
        shell: bash

      - name: Deploy to shinyapps.io
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
          SHINYAPPS_ACCOUNT: ${{ vars.SHINYAPPS_ACCOUNT }}
        run: |
          rsconnect::setAccountInfo(
            name = if (nzchar(Sys.getenv("SHINYAPPS_ACCOUNT"))) Sys.getenv("SHINYAPPS_ACCOUNT") else "hutianle",
            token = Sys.getenv("SHINYAPPS_TOKEN"),
            secret = Sys.getenv("SHINYAPPS_SECRET")
          )
          rsconnect::deployApp(appDir = ".", appName = "gsdesign-explorer", forceUpdate = TRUE)
        shell: Rscript {0}
